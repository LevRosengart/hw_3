[project]
name = "portscan"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "LevRosengart", email = "levkonst2007@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dnspython>=2.9.2",
    "pytest-mock>=3.17.0",
]

[project.scripts]
portscan = "portscan.__main__:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
